name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q promptforge tasks
      - name: Harness self-check (baseline fails / reference passes)
        run: python scripts/check_harness.py
